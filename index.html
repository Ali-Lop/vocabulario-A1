
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Practice your vocabulary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <img src="https://yohablotuhablas.com/wp-content/uploads/2025/04/logo-yo-hablo-tu-hablas.png" alt="Logo" class="logo" />
    <h1>Practice your vocabulary</h1>
    
    <p class="subtitle">
      Translate the following English word into Spanish.
    </p>
    <div class="disclaimer">
      🇪🇸 You can write with or without accents, with or without "ñ"
    </div>

    <div id="word-container">
      <p id="english-word"></p>
      <input type="text" id="answer-input" placeholder="Write your answer in Spanish">
    </div>
	
    <button id="check-btn">Check</button>
    <button id="show-btn" disabled>Show answer</button>
    <button id="next-btn" disabled>Next word</button>

    <!-- Feedback -->
    <div class="feedback" id="feedback"></div>
    <div class="correct-answer" id="correct-answer"></div>

   <!-- Stats -->
<div class="stats" id="stats">
  ✅ Correct answers: <span id="correct-count">0</span> |
  ❌ Errors: <span id="error-count">0</span> |
  🔢 Accuracy: <span id="accuracy">0%</span>
</div>

  <script src="script.js"></script>
</body>
</html>
